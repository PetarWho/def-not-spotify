  #   restart: always
  #   command: tunnel run
  #   environment:
  #     - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
  #   depends_on:
  #     - navidrome
  #   networks:
  #     - navidrome-network

networks:
  navidrome-network:
    driver: bridge